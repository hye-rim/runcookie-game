<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>달려라 쿠키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage {
    position:relative; width:100%; height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px;
  }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink);
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
  }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  /* 버튼 모양은 작아도 누르는 범위는 손가락 크기(44px 남짓)로 넓힌다 */
  #hud button { position:relative; }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #wrap { position:relative; }
  #game {
    display:block; touch-action:none;
    border:4px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink);
    background:#8fd3ff;
  }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:20px;
    background:rgba(43,29,82,.55);
    border-radius:18px;
    backdrop-filter:blur(3px);
    overflow-y:auto;
    touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 {
    color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink);
  }
  #overlay h1 { font-size:clamp(40px, 11vw, 60px); line-height:1.05; color:#ffb35c; }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:15px; line-height:1.6; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:52px; color:var(--yellow); font-variant-numeric:tabular-nums; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); line-height:1; }
  #overlay .big small { font-size:22px; margin-left:4px; }
  #overlay .badge { background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:4px 14px; font-size:15px; }
  #overlay .badge.good { background:#8dffb0; }
  #overlay .help {
    font-size:14px; color:var(--ink); line-height:1.75;
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:10px 16px;
  }
  #overlay button {
    margin-top:2px;
    background:var(--yellow); color:var(--ink); font-size:22px; font-family:inherit;
    border:3px solid var(--ink); border-radius:999px; padding:10px 38px;
    box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #overlay button:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }

  /* 화면 조작 버튼 (터치 기기에서만): 쿠키런처럼 화면 양쪽 끝에 큼직하게. 왼쪽 슬라이드, 오른쪽 점프 */
  #pad { display:none; position:absolute; inset:0; pointer-events:none; z-index:3; }
  body.touch #pad { display:block; }
  #pad button {
    position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); width:var(--side, 120px); height:min(64%, 230px);
    pointer-events:auto; border:3px solid var(--ink); border-radius:28px; box-shadow:0 6px 0 var(--ink);
    font-size:22px; font-family:inherit; color:var(--ink); touch-action:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; line-height:1.15;
  }
  #pad button .ic { font-size:34px; line-height:1; }
  #pad button small { font-size:12px; color:var(--muted); }
  #pad #btnSlide { left:calc(8px + env(safe-area-inset-left)); background:#c9e7ff; }
  #pad #btnJump { right:calc(8px + env(safe-area-inset-right)); background:var(--yellow); }
  #pad button.on { transform:translateY(5px); box-shadow:0 1px 0 var(--ink); filter:brightness(.95); }

  /* 작은 게임 화면(폰): 점수판과 안내·결과 창을 컴팩트하게. body.compact 는 JS 가 실제 게임 화면 크기로 정한다
     (기본 규칙보다 뒤에 있어야 덮어쓴다) */
  body.compact #hud { gap:4px; padding-bottom:6px; }
  body.compact #hud .label { display:none; }
  body.compact #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
  body.compact #hud .value { font-size:17px; }
  body.compact #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  body.compact #overlay { position:fixed; inset:0; z-index:10; border-radius:0; background:rgba(43,29,82,.74); gap:6px; padding:10px 16px; }
  body.compact #overlay h1 { font-size:38px; }
  body.compact #overlay h1 br { display:none; }
  body.compact #overlay h2 { font-size:24px; -webkit-text-stroke-width:5px; }
  body.compact #overlay p { font-size:13px; line-height:1.4; }
  body.compact #overlay .big { font-size:36px; -webkit-text-stroke-width:5px; }
  body.compact #overlay .big small { font-size:18px; }
  body.compact #overlay .badge { font-size:13px; padding:3px 12px; box-shadow:0 3px 0 var(--ink); }
  body.compact #overlay .help { font-size:11.5px; padding:6px 10px; line-height:1.55; }
  body.compact #overlay button { font-size:18px; padding:7px 28px; box-shadow:0 5px 0 var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
        <button id="pauseBtn" title="일시정지 (P)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay"></div>
    </div>
  </div>
  <div id="pad">
    <button id="btnSlide"><span class="ic">🛝</span>슬라이드<small>누르고 있기</small></button>
    <button id="btnJump"><span class="ic">⬆️</span>점프<small>한 번 더 누르면 2단</small></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
